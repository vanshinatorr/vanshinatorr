<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 55" width="400" height="55">
  <!-- Card Shell -->
  <rect x="0.5" y="0.5" width="399" height="54" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="5" ry="5" />

  <!-- CSS Styles -->
  <style>
    .term-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 8px;
      fill: #475569;
      letter-spacing: 0.05em;
    }
    .term-prompt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      fill: #64748b;
    }
    .cmd-text {
      fill: #38bdf8;
      font-weight: bold;
    }
    .cursor-block {
      fill: #38bdf8;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Window Controls (Mac style dots) -->
  <circle cx="15" cy="14" r="3.5" fill="#ff5f56" />
  <circle cx="25" cy="14" r="3.5" fill="#ffbd2e" />
  <circle cx="35" cy="14" r="3.5" fill="#27c93f" />
  
  <!-- Title Text -->
  <text x="200" y="17" class="term-title" text-anchor="middle">zsh — vansh-vijay</text>

  <!-- Title Bar Divider -->
  <line x1="0" y1="26" x2="400" y2="26" stroke="#1e293b" stroke-width="0.75" />

  <!-- Terminal Command Prompt -->
  <text x="15" y="42" class="term-prompt">node-engine % <tspan class="cmd-text">npx vansh-vijay</tspan><tspan class="cursor-block">█</tspan></text>
</svg>
