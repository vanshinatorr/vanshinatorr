name: Update Streak Stats Cache

on:
  schedule:
    - cron: '0 0,12 * * *' # Run twice daily at 00:00 and 12:00 UTC
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - '.github/workflows/update_streak.yml' # Trigger instantly when workflow file is changed

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Fetch and Validate Streak SVG
        run: |
          curl -f -s -o temp_streak.svg "https://streak-stats.demolab.com?user=vanshinatorr&background=0d0e12&border=1e293b&stroke=334155&ring=38bdf8&fire=38bdf8&currStreakNum=e2e8f0&sideNums=cbd5e1&sideLabels=94a3b8&dates=64748b&hide_border=false&date_format=j%20M%5B%20Y%5D"
          if [ $? -eq 0 ] && [ -s temp_streak.svg ] && grep -q "<svg" temp_streak.svg && ! grep -q "Failed to retrieve" temp_streak.svg; then
            python3 .github/scripts/post_process_streak.py
            mv temp_streak.svg streak_stats.svg
            echo "Validation passed. Streak stats SVG cache updated."
          else
            echo "Validation failed (Server returned 503/Error or API failure). Retaining previous cached SVG to prevent profile display errors."
            rm -f temp_streak.svg
          fi

      - name: Commit and Push Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streak_stats.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update streak stats SVG cache [skip ci]"
            git push origin main
          else
            echo "No changes detected in streak stats."
          fi
