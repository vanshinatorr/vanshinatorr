name: Update Streak Stats Cache

on:
  schedule:
    - cron: '0 0,12 * * *' # Run twice daily at 00:00 and 12:00 UTC
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - '.github/workflows/update_streak.yml' # Trigger instantly when workflow file is changed

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Fetch Latest Streak SVG
        run: |
          curl -s -o streak_stats.svg "https://streak-stats.demolab.com?user=vanshinatorr&background=0d0e12&border=1e293b&stroke=334155&ring=38bdf8&fire=38bdf8&currStreakNum=e2e8f0&sideNums=cbd5e1&sideLabels=94a3b8&dates=64748b&hide_border=true&date_format=j%20M%5B%20Y%5D"

      - name: Commit and Push Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streak_stats.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update streak stats SVG cache [skip ci]"
            git push origin main
          else
            echo "No changes detected in streak stats."
          fi
