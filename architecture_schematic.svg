<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <rect x="0.5" y="0.5" width="799" height="219" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="6" ry="6" />
  <!-- CSS Styles -->
  <style>
    .label-meta {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      fill: #94a3b8;
      letter-spacing: 0.08em;
    }
    .text-header {
      font-family: 'JetBrains Mono', monospace;
      font-weight: bold;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 0.05em;
    }
    .text-diagram {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #ffffff;
      transition: fill 0.25s;
    }
    .text-specs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #94a3b8;
    }
    .spec-value {
      fill: #ffffff;
      font-weight: bold;
      transition: fill 0.25s;
    }
    .spec-tag {
      fill: #38bdf8; /* Slate blue accent */
      font-weight: bold;
    }
    
    /* Interactive Hover Effects */
    .flow-group {
      cursor: pointer;
    }
    .flow-box {
      transition: fill 0.25s, stroke 0.25s, transform 0.25s;
    }
    .flow-group:hover .flow-box {
      fill: #111827;
      stroke: #38bdf8;
    }
    .detail-text {
      opacity: 0;
      fill: #38bdf8;
      font-size: 8.5px;
      font-family: 'JetBrains Mono', monospace;
      transition: opacity 0.25s;
    }
    .flow-group:hover .detail-text {
      opacity: 1;
    }
    .flow-group:hover .text-diagram {
      fill: #ffffff;
    }
    .spec-row {
      transition: fill 0.2s;
      cursor: pointer;
    }
    .spec-row:hover {
      fill: #ffffff;
    }
    .spec-row:hover .spec-value {
      fill: #38bdf8;
    }
  </style>

  <!-- Top Header Bar -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="23" class="text-header">VANSH VIJAY // ARCHITECTURE SCHEMATIC</text>
  <text x="780" y="23" class="label-meta" text-anchor="end">SYS_STATUS: ACTIVE [v1.2.0-stable]</text>

  <!-- Column Dividers -->
  <line x1="390" y1="36" x2="390" y2="220" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT COLUMN: System Architecture Diagram (Flowchart) -->
  <text x="20" y="58" class="label-meta">01 / SYSTEM STACK PIPELINE</text>
  
  <g transform="translate(20, 70)">
    <!-- Box 1: Client UI -->
    <g class="flow-group">
      <rect class="flow-box" x="0" y="0" width="350" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">CLIENT INTERFACE [ Next.js / React / Tailwind ]</text>
      <text x="338" y="15" class="detail-text" style="text-anchor: end;">HMR / Responsive UI / SPA Router</text>
    </g>
    
    <!-- Arrow 1 -->
    <line x1="175" y1="24" x2="175" y2="40" stroke="#334155" stroke-width="1" />
    <polygon points="175,40 172,36 178,36" fill="#334155" />

    <!-- Box 2: Server Gateway -->
    <g class="flow-group" transform="translate(0, 40)">
      <rect class="flow-box" x="0" y="0" width="350" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">API GATEWAY [ Express.js (REST) / Socket.IO (WS) ]</text>
      <text x="338" y="15" class="detail-text" style="text-anchor: end;">JWT Auth / Low-Latency Socket Rooms</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="175" y1="64" x2="175" y2="80" stroke="#334155" stroke-width="1" />
    <polygon points="175,80 172,76 178,76" fill="#334155" />

    <!-- Box 3: Database & Integrations -->
    <g class="flow-group" transform="translate(0, 80)">
      <rect class="flow-box" x="0" y="0" width="350" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">DATA SHARD [ MongoDB / Razorpay Webhooks ]</text>
      <text x="338" y="15" class="detail-text" style="text-anchor: end;">Transactional Hooks / DB Indexing</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: System Specifications & Identity -->
  <g transform="translate(415, 0)">
    <text x="0" y="58" class="label-meta">02 / CORE SPECIFICATIONS</text>
    
    <g transform="translate(0, 80)" class="text-specs">
      <g class="spec-row"><text x="0" y="5">DEVELOPER   : <tspan class="spec-value">Vansh Vijay</tspan></text></g>
      <g class="spec-row"><text x="0" y="30">SPECIALTY   : <tspan class="spec-value">Node.js Backends &amp; Real-time Systems</tspan></text></g>
      <g class="spec-row"><text x="0" y="55">DSA ENGINE  : <tspan class="spec-value">300+ Problems Solved</tspan> <tspan class="spec-tag">[C++]</tspan></text></g>
      <g class="spec-row"><text x="0" y="80">ACTIVE APP  : <tspan class="spec-value">ConsistPay (60+ Active Users, Monetized)</tspan></text></g>
      <g class="spec-row"><text x="0" y="105">MATCHMAKER : <tspan class="spec-value">Chess Multiplayer (Socket.IO Room Sync)</tspan></text></g>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <line x1="0" y1="196" x2="800" y2="196" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="209" class="label-meta">BUILDING REAL PRODUCTS, NOT JUST PROJECTS.</text>
  <text x="780" y="209" class="label-meta" text-anchor="end">LOC: JAIPUR, IN // COGNITIVE_STATE: ACTIVE</text>
</svg>
