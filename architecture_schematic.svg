<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <rect x="0.5" y="0.5" width="799" height="219" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="6" ry="6" />
  <!-- CSS Styles -->
  <style>
    .label-meta {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      fill: #94a3b8;
      letter-spacing: 0.08em;
    }
    .text-header {
      font-family: 'JetBrains Mono', monospace;
      font-weight: bold;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 0.05em;
    }
    .text-diagram {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #ffffff;
      transition: fill 0.25s;
    }
    .text-specs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      fill: #94a3b8;
    }
    .spec-value {
      fill: #ffffff;
      font-weight: bold;
      transition: fill 0.25s;
    }
    .spec-tag {
      fill: #38bdf8; /* Slate blue accent */
      font-weight: bold;
    }
    
    /* Interactive Hover Effects */
    .flow-group {
      cursor: pointer;
    }
    .flow-box {
      transition: fill 0.25s, stroke 0.25s, transform 0.25s;
    }
    .flow-group:hover .flow-box {
      fill: #111827;
      stroke: #38bdf8;
    }
    .detail-text {
      opacity: 0;
      fill: #38bdf8;
      font-size: 8.5px;
      font-family: 'JetBrains Mono', monospace;
      transition: opacity 0.25s;
    }
    .flow-group:hover .detail-text {
      opacity: 1;
    }
    .flow-group:hover .text-diagram {
      fill: #ffffff;
    }
    .spec-row {
      transition: fill 0.2s;
      cursor: pointer;
    }
    .spec-row:hover {
      fill: #ffffff;
    }
    .spec-row:hover .spec-value {
      fill: #38bdf8;
    }
  </style>

  <!-- Top Header Bar -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="23" class="text-header">VANSH VIJAY | SYSTEM ARCHITECTURE</text>

  <!-- Column Dividers -->
  <line x1="390" y1="36" x2="390" y2="220" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT COLUMN: System Architecture Diagram (Flowchart) -->
  <text x="20" y="58" class="label-meta">01 / SYSTEM STACK PIPELINE</text>
  
  <g transform="translate(20, 60)">
    <!-- Box 1: Client UI -->
    <g class="flow-group">
      <rect class="flow-box" x="0" y="0" width="340" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">CLIENT UI [ React / Next.js / Tailwind CSS ]</text>
      <text x="328" y="15" class="detail-text" style="text-anchor: end;">SPA Router / Responsive / State Management</text>
    </g>
    
    <!-- Arrow 1 -->
    <line x1="170" y1="24" x2="170" y2="34" stroke="#334155" stroke-width="1" />
    <polygon points="170,34 167,30 173,30" fill="#334155" />
 
    <!-- Box 2: Backend API -->
    <g class="flow-group" transform="translate(0, 34)">
      <rect class="flow-box" x="0" y="0" width="340" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">BACKEND API [ Node.js / Express / REST APIs ]</text>
      <text x="328" y="15" class="detail-text" style="text-anchor: end;">JWT Security / MVC Architecture / CRUD</text>
    </g>
 
    <!-- Arrow 2 -->
    <line x1="170" y1="58" x2="170" y2="68" stroke="#334155" stroke-width="1" />
    <polygon points="170,68 167,64 173,64" fill="#334155" />
 
    <!-- Box 3: Database Layer -->
    <g class="flow-group" transform="translate(0, 68)">
      <rect class="flow-box" x="0" y="0" width="340" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">DATABASE LAYER [ MongoDB / Mongoose ODM ]</text>
      <text x="328" y="15" class="detail-text" style="text-anchor: end;">Indexing / Validation / Schema Models</text>
    </g>
 
    <!-- Arrow 3 -->
    <line x1="170" y1="92" x2="170" y2="102" stroke="#334155" stroke-width="1" />
    <polygon points="170,102 167,98 173,98" fill="#334155" />
 
    <!-- Box 4: Integrations -->
    <g class="flow-group" transform="translate(0, 102)">
      <rect class="flow-box" x="0" y="0" width="340" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="15" class="text-diagram" style="text-anchor: start;">INTEGRATIONS [ Razorpay / Gemini AI API ]</text>
      <text x="328" y="15" class="detail-text" style="text-anchor: end;">Webhook Receiver / Dynamic AI Prompts</text>
    </g>
  </g>
 
  <!-- RIGHT COLUMN: System Specifications & Identity -->
  <g transform="translate(420, 0)">
    <text x="0" y="58" class="label-meta">02 / CORE SPECIFICATIONS</text>
    
    <g transform="translate(0, 75)" class="text-specs">
      <g class="spec-row"><text x="0" y="5">DEVELOPER   : <tspan class="spec-value">Vansh Vijay</tspan></text></g>
      <g class="spec-row"><text x="0" y="32">EDUCATION   : <tspan class="spec-value">B.Tech CSE (CGPA: 7.75)</tspan></text></g>
      <g class="spec-row"><text x="0" y="59">EXPERIENCE  : <tspan class="spec-value">Full-Stack Intern (Plasmid)</tspan></text></g>
      <g class="spec-row"><text x="0" y="86">ACTIVE APP  : <tspan class="spec-value">ConsistPay</tspan></text></g>
      <g class="spec-row"><text x="0" y="113">CREDENTIALS : <tspan class="spec-value">GCP &amp; MongoDB Certified</tspan></text></g>
    </g>
  </g>
 
  <!-- Bottom Details Bar -->
  <line x1="0" y1="196" x2="800" y2="196" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="209" class="label-meta">BUILDING REAL PRODUCTS, NOT JUST PROJECTS.</text>
</svg>
