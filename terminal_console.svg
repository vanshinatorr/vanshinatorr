<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <!-- Card Shell -->
  <rect x="0.5" y="0.5" width="799" height="119" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="6" ry="6" />

  <!-- Tactical HUD Corner Brackets -->
  <path d="M 8 18 L 8 8 L 18 8" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 792 18 L 792 8 L 782 8" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 8 102 L 8 112 L 18 112" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 792 102 L 792 112 L 782 112" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- CSS Styles -->
  <style>
    .terminal-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      fill: #64748b;
      letter-spacing: 0.05em;
    }
    .prompt-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      fill: #64748b;
    }
    .cmd-text {
      fill: #38bdf8;
      font-weight: bold;
    }
    .cursor-block {
      fill: #38bdf8;
      animation: blink 1s step-end infinite;
    }
    .spec-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      fill: #64748b;
    }
    .spec-value {
      fill: #ffffff;
      font-weight: bold;
    }
    .hud-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 7px;
      fill: #334155;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Title Bar -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls (Mac style dots) -->
  <circle cx="20" cy="16" r="4.5" fill="#ff5f56" />
  <circle cx="35" cy="16" r="4.5" fill="#ffbd2e" />
  <circle cx="50" cy="16" r="4.5" fill="#27c93f" />
  
  <!-- Title Text -->
  <text x="400" y="20" class="terminal-title" text-anchor="middle">zsh — vansh@node-engine: ~</text>

  <!-- Left Column: Interactive Command Prompt -->
  <text x="25" y="76" class="prompt-text">vansh@node-engine % <tspan class="cmd-text">npx vansh-vijay</tspan><tspan class="cursor-block">█</tspan></text>

  <!-- Column Divider -->
  <line x1="390" y1="32" x2="390" y2="120" stroke="#1e293b" stroke-width="1" />

  <!-- Right Column: Connections Specs -->
  <g transform="translate(415, 0)">
    <text x="0" y="62" class="spec-label">LINKEDIN : <tspan class="spec-value">linkedin.com/in/vansh-vijay</tspan></text>
    <text x="0" y="90" class="spec-label">EMAIL    : <tspan class="spec-value">vanshvijay9784@gmail.com</tspan></text>
  </g>
</svg>
