<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" style="background: #0d0e12; border-radius: 6px; border: 1px solid #1e293b;">
  <!-- CSS Styles -->
  <style>
    .label-meta {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 9px;
      fill: #475569;
      letter-spacing: 0.08em;
    }
    .text-header {
      font-family: 'JetBrains Mono', monospace;
      font-weight: bold;
      font-size: 12px;
      fill: #e2e8f0;
      letter-spacing: 0.05em;
    }
    .text-title {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 800;
      font-size: 26px;
      fill: #ffffff;
      letter-spacing: -0.02em;
    }
    .text-subtitle {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #94a3b8;
    }
    .text-diagram {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #94a3b8;
      text-anchor: middle;
    }
    .text-specs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #e2e8f0;
    }
    .spec-value {
      fill: #cbd5e1;
    }
    .spec-tag {
      fill: #f59e0b; /* Amber accent */
      font-weight: bold;
    }
  </style>

  <!-- Top Header Bar -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="23" class="text-header">VANSH VIJAY // ARCHITECTURE SCHEMATIC</text>
  <text x="780" y="23" class="label-meta" text-anchor="end">SYS_STATUS: READY [v1.2.0]</text>

  <!-- Column Dividers -->
  <line x1="390" y1="36" x2="390" y2="220" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT COLUMN: System Architecture Diagram (Flowchart) -->
  <text x="20" y="58" class="label-meta">01 / STACK PIPELINE</text>
  
  <g transform="translate(20, 70)">
    <!-- Box 1: Client UI -->
    <rect x="0" y="0" width="350" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="175" y="15" class="text-diagram">CLIENT INTERFACE [ Next.js / React / Tailwind ]</text>
    
    <!-- Arrow 1 -->
    <line x1="175" y1="24" x2="175" y2="40" stroke="#334155" stroke-width="1" />
    <polygon points="175,40 172,36 178,36" fill="#334155" />

    <!-- Box 2: Server Gateway -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="350" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="175" y="15" class="text-diagram">API GATEWAY [ Express.js (REST) / Socket.IO (WS) ]</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="175" y1="64" x2="175" y2="80" stroke="#334155" stroke-width="1" />
    <polygon points="175,80 172,76 178,76" fill="#334155" />

    <!-- Box 3: Database & Integrations -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="350" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="175" y="15" class="text-diagram">DATA SHARD [ MongoDB / Razorpay Webhooks ]</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: System Specifications & Identity -->
  <g transform="translate(415, 0)">
    <text x="0" y="58" class="label-meta">02 / CORE CAPABILITIES</text>
    
    <g transform="translate(0, 80)" class="text-specs">
      <text x="0" y="0">DEVELOPER   : <tspan class="spec-value">Vansh Vijay</tspan></text>
      <text x="0" y="20">SPECIALTY   : <tspan class="spec-value">Node.js Backends &amp; Real-time Systems</tspan></text>
      <text x="0" y="40">DSA ENGINE  : <tspan class="spec-value">300+ Problems Solved</tspan> <tspan class="spec-tag">[C++]</tspan></text>
      <text x="0" y="60">ACTIVE APP  : <tspan class="spec-value">ConsistPay (60+ Active Users, Monetized)</tspan></text>
      <text x="0" y="80">MATCHMAKER : <tspan class="spec-value">Chess Multiplayer (Socket.IO Room Sync)</tspan></text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <line x1="0" y1="196" x2="800" y2="196" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="209" class="label-meta">BUILDING REAL PRODUCTS, NOT JUST PROJECTS.</text>
  <text x="780" y="209" class="label-meta" text-anchor="end">LOC: JAIPUR, IN // COGNITIVE_STATE: ACTIVE</text>
</svg>
