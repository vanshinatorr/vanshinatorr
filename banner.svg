<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%" style="background: #04040a; border-radius: 12px; border: 1px solid rgba(129, 140, 248, 0.12); box-shadow: 0 12px 36px rgba(0,0,0,0.65);">
  <!-- Styles and Animations -->
  <style>
    @keyframes scan {
      0% { transform: translateY(-40px); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes nebulaBreathe {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.05; }
      50% { transform: scale(1.1) translate(10px, -5px); opacity: 0.09; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.05; }
    }
    .text-title {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 52px;
      letter-spacing: -0.04em;
    }
    .text-motto {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      fill: #a78bfa;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .text-code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12.5px;
      fill: #a9b2c3;
    }
    .code-keyword { fill: #f472b6; font-weight: bold; }
    .code-var { fill: #818cf8; }
    .code-string { fill: #34d399; }
    .code-num { fill: #fbbf24; }
    .code-comment { fill: #64748b; font-style: italic; }
  </style>

  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0b18" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#04040a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />

  <!-- Soft Ambient Cosmic Nebulae -->
  <circle cx="180" cy="130" r="160" fill="#818cf8" filter="url(#glow)" style="animation: nebulaBreathe 10s infinite ease-in-out; transform-origin: 180px 130px;" />
  <circle cx="620" cy="130" r="150" fill="#22d3ee" filter="url(#glow)" style="animation: nebulaBreathe 14s infinite ease-in-out; transform-origin: 620px 130px;" />

  <!-- High-fidelity fine grid overlay -->
  <path d="M 0,26 L 800,26 M 0,52 L 800,52 M 0,78 L 800,78 M 0,104 L 800,104 M 0,130 L 800,130 M 0,156 L 800,156 M 0,182 L 800,182 M 0,208 L 800,208 M 0,234 L 800,234" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />
  <path d="M 40,0 L 40,260 M 80,0 L 80,260 M 120,0 L 120,260 M 160,0 L 160,260 M 200,0 L 200,260 M 240,0 L 240,260 M 280,0 L 280,260 M 320,0 L 320,260 M 360,0 L 360,260 M 400,0 L 400,260 M 440,0 L 440,260 M 480,0 L 480,260 M 520,0 L 520,260 M 560,0 L 560,260 M 600,0 L 600,260 M 640,0 L 640,260 M 680,0 L 680,260 M 720,0 L 720,260 M 760,0 L 760,260" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />

  <!-- Thin Scanning Oscilloscope Line -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="url(#neonLaser)" stroke-width="1.2" style="animation: scan 7s infinite linear; will-change: transform;" />

  <!-- Left Section: Premium Identity -->
  <g transform="translate(50, 45)">
    <!-- Active Status Indicator -->
    <g transform="translate(0, 0)">
      <!-- Animated Ripple Rings -->
      <circle cx="6" cy="6" r="6" fill="#00e676" opacity="0.3" style="animation: pulseRing 2.2s infinite ease-out; transform-origin: 6px 6px;" />
      <circle cx="6" cy="6" r="6" fill="#00e676" opacity="0.15" style="animation: pulseRing 2.2s infinite ease-out; animation-delay: 1.1s; transform-origin: 6px 6px;" />
      <!-- Solid Center Dot -->
      <circle cx="6" cy="6" r="3.5" fill="#00e676" />
      <text x="18" y="9" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00e676" font-weight="bold" letter-spacing="0.05em">READY_TO_BUILD</text>
    </g>

    <!-- Name and Tagline -->
    <text class="text-title" x="-3" y="65">Vansh Vijay</text>
    <text class="text-motto" x="0" y="92">Building real products, not just tutorials.</text>

    <!-- Sleek Tech Badge Tags -->
    <g transform="translate(0, 114)" font-family="'JetBrains Mono', monospace" font-size="9.5">
      <rect x="0" y="0" width="54" height="18" rx="3" fill="rgba(129, 140, 248, 0.09)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="0.8" />
      <text x="27" y="12" fill="#818cf8" text-anchor="middle">MERN</text>

      <rect x="62" y="0" width="80" height="18" rx="3" fill="rgba(34, 211, 238, 0.09)" stroke="rgba(34, 211, 238, 0.25)" stroke-width="0.8" />
      <text x="102" y="12" fill="#22d3ee" text-anchor="middle">WebSockets</text>

      <rect x="150" y="0" width="68" height="18" rx="3" fill="rgba(251, 146, 60, 0.09)" stroke="rgba(251, 146, 60, 0.25)" stroke-width="0.8" />
      <text x="184" y="12" fill="#fb923c" text-anchor="middle">Payments</text>
    </g>
  </g>

  <!-- Right Section: Clean Code Console IDE -->
  <g transform="translate(485, 40)">
    <!-- Console Container Box -->
    <rect width="265" height="172" rx="8" fill="#05050b" stroke="rgba(129, 140, 248, 0.15)" stroke-width="1" />
    <!-- Header tabs bar -->
    <path d="M 0,26 L 265,26" stroke="rgba(129, 140, 248, 0.12)" stroke-width="1" />
    
    <!-- Top-Bar MacOS Dots -->
    <circle cx="15" cy="13" r="3.5" fill="#ff5f56" />
    <circle cx="25" cy="13" r="3.5" fill="#ffbd2e" />
    <circle cx="35" cy="13" r="3.5" fill="#27c93f" />
    
    <text x="250" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b" text-anchor="end">developer.js</text>
    
    <!-- Clean, Highly Readable Code Text -->
    <g class="text-code" transform="translate(18, 44)">
      <text x="0" y="15"><tspan class="code-comment">// Core candidate config</tspan></text>
      <text x="0" y="34"><tspan class="code-keyword">const</tspan> <tspan class="code-var">developer</tspan> = {</text>
      <text x="15" y="53">role: <tspan class="code-string">"Full-Stack SDE"</tspan>,</text>
      <text x="15" y="72">focus: <tspan class="code-string">"Node.js &amp; Architecture"</tspan>,</text>
      <text x="15" y="91">dsa: <tspan class="code-string">"300+ Problems Solved"</tspan>,</text>
      <text x="15" y="110">metrics: <tspan class="code-string">"60+ Active Users"</tspan></text>
      <text x="0" y="129">};</text>
    </g>
  </g>

  <!-- Bottom boundary line -->
  <line x1="20" y1="238" x2="780" y2="238" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  <text x="25" y="249" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="rgba(122, 122, 140, 0.5)" letter-spacing="0.02em">UPTIME: 99.98% // ENVIRONMENT: DEPLOYED</text>
  <text x="775" y="249" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="rgba(122, 122, 140, 0.5)" text-anchor="end" letter-spacing="0.02em">VANSHINATORR // CLUSTERS: 1</text>
</svg>
