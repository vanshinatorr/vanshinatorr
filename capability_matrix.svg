<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <rect x="0.5" y="0.5" width="494" height="194" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="6" ry="6" />
  <!-- CSS Styles -->
  <style>
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 2 2;
    }
    .axis-line {
      stroke: #1e293b;
      stroke-width: 1;
    }
    .radar-poly {
      fill: rgba(56, 189, 248, 0.12);
      stroke: #38bdf8;
      stroke-width: 1.5;
      transition: fill 0.3s, stroke 0.3s;
    }
    .radar-poly:hover {
      fill: rgba(56, 189, 248, 0.18);
      stroke: #38bdf8;
    }
    .radar-label {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      fill: #ffffff;
      font-weight: bold;
    }
    .grid-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 7.5px;
      fill: #94a3b8;
    }
    .chart-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #94a3b8;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Title -->
  <text x="20" y="24" class="chart-title">03 / CAPABILITY MATRIX</text>

  <!-- Nested Grid Pentagons (Centered at 247.5, 105) - Scaled Up to r=80 -->
  <!-- 100% Limit -->
  <polygon points="247.5,25 323.6,80.3 294.5,169.7 200.5,169.7 171.4,80.3" fill="none" class="grid-line" />
  <!-- 66% Limit -->
  <polygon points="247.5,52.2 297.7,88.7 278.5,147.7 216.5,147.7 197.3,88.7" fill="none" class="grid-line" />
  <!-- 33% Limit -->
  <polygon points="247.5,78.6 272.6,96.8 263.0,126.4 232.0,126.4 222.4,96.8" fill="none" class="grid-line" />

  <!-- Grid Scale Labels -->
  <text x="250.5" y="31" class="grid-label">1.00</text>
  <text x="250.5" y="58" class="grid-label">0.66</text>
  <text x="250.5" y="85" class="grid-label">0.33</text>

  <!-- Axis Lines (from center (247.5, 105)) -->
  <line x1="247.5" y1="105" x2="247.5" y2="25" class="axis-line" />
  <line x1="247.5" y1="105" x2="323.6" y2="80.3" class="axis-line" />
  <line x1="247.5" y1="105" x2="294.5" y2="169.7" class="axis-line" />
  <line x1="247.5" y1="105" x2="200.5" y2="169.7" class="axis-line" />
  <line x1="247.5" y1="105" x2="171.4" y2="80.3" class="axis-line" />

  <!-- Actual Candidate Skill Polygon (Scaled to r=80 max) -->
  <polygon points="247.5,29 312.2,84 280.4,150.3 216.9,147.1 190.4,86.5" class="radar-poly" />

  <!-- Vertices Data Nodes -->
  <circle cx="247.5" cy="29" r="2.5" fill="#66fcf1" />
  <circle cx="312.2" cy="84" r="2.5" fill="#66fcf1" />
  <circle cx="280.4" cy="150.3" r="2.5" fill="#66fcf1" />
  <circle cx="216.9" cy="147.1" r="2.5" fill="#66fcf1" />
  <circle cx="190.4" cy="86.5" r="2.5" fill="#66fcf1" />

  <!-- Labels -->
  <text x="247.5" y="18" class="radar-label" text-anchor="middle">BACKEND</text>
  <text x="332" y="83" class="radar-label" text-anchor="start">DSA</text>
  <text x="302" y="182" class="radar-label" text-anchor="start">SYSTEMS</text>
  <text x="193" y="182" class="radar-label" text-anchor="end">FRONTEND</text>
  <text x="163" y="83" class="radar-label" text-anchor="end">DATABASES</text>
</svg>
