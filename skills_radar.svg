<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <rect x="0.5" y="0.5" width="494" height="194" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="6" ry="6" />
  <!-- CSS Styles -->
  <style>
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 2 2;
    }
    .axis-line {
      stroke: #1e293b;
      stroke-width: 1;
    }
    .radar-poly {
      fill: rgba(56, 189, 248, 0.12);
      stroke: #38bdf8;
      stroke-width: 1.5;
      transition: fill 0.3s, stroke 0.3s;
    }
    .radar-poly:hover {
      fill: rgba(56, 189, 248, 0.18);
      stroke: #38bdf8;
    }
    .radar-label {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      fill: #ffffff;
      font-weight: bold;
    }
    .grid-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 7.5px;
      fill: #94a3b8;
    }
    .chart-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #94a3b8;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Title -->
  <text x="20" y="24" class="chart-title">03 / CAPABILITY MATRIX</text>

  <!-- Nested Grid Pentagons (Centered at 247.5, 105) -->
  <!-- 100% Limit -->
  <polygon points="247.5,37 312.1,84 287.4,160 207.6,160 182.9,84" fill="none" class="grid-line" />
  <!-- 66% Limit -->
  <polygon points="247.5,60 290.3,91.1 273.9,141.4 221.1,141.4 204.7,91.1" fill="none" class="grid-line" />
  <!-- 33% Limit -->
  <polygon points="247.5,83 268.4,98.2 260.4,122.8 234.6,122.8 226.6,98.2" fill="none" class="grid-line" />

  <!-- Grid Scale Labels -->
  <text x="250.5" y="43" class="grid-label">1.00</text>
  <text x="250.5" y="66" class="grid-label">0.66</text>
  <text x="250.5" y="89" class="grid-label">0.33</text>

  <!-- Axis Lines (from center (247.5, 105)) -->
  <line x1="247.5" y1="105" x2="247.5" y2="37" class="axis-line" />
  <line x1="247.5" y1="105" x2="312.1" y2="84" class="axis-line" />
  <line x1="247.5" y1="105" x2="287.4" y2="160" class="axis-line" />
  <line x1="247.5" y1="105" x2="207.6" y2="160" class="axis-line" />
  <line x1="247.5" y1="105" x2="182.9" y2="84" class="axis-line" />

  <!-- Actual Candidate Skill Polygon -->
  <polygon points="247.5,40.4 305.7,86.1 281.4,151.8 215.6,149 190.6,86.5" class="radar-poly" />

  <!-- Vertices Data Nodes -->
  <circle cx="247.5" cy="40.4" r="2" fill="#66fcf1" />
  <circle cx="305.7" cy="86.1" r="2" fill="#66fcf1" />
  <circle cx="281.4" cy="151.8" r="2" fill="#66fcf1" />
  <circle cx="215.6" cy="149" r="2" fill="#66fcf1" />
  <circle cx="190.6" cy="86.5" r="2" fill="#66fcf1" />

  <!-- Labels -->
  <text x="247.5" y="29" class="radar-label" text-anchor="middle">BACKEND</text>
  <text x="320" y="86" class="radar-label" text-anchor="start">DSA</text>
  <text x="294" y="170" class="radar-label" text-anchor="start">SYSTEMS</text>
  <text x="201" y="170" class="radar-label" text-anchor="end">FRONTEND</text>
  <text x="175" y="86" class="radar-label" text-anchor="end">DATABASES</text>
</svg>
