<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <!-- Card Shell -->
  <rect x="0.5" y="0.5" width="799" height="119" fill="#0d0e12" stroke="#1e293b" stroke-width="1" rx="6" ry="6" />

  <!-- Tactical HUD Corner Brackets -->
  <path d="M 8 18 L 8 8 L 18 8" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 792 18 L 792 8 L 782 8" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 8 102 L 8 112 L 18 112" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 792 102 L 792 112 L 782 112" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- CSS Styles -->
  <style>
    .chart-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      fill: #ffffff;
      letter-spacing: 0.05em;
      font-weight: bold;
    }
    .col-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      fill: #64748b;
      letter-spacing: 0.08em;
      font-weight: bold;
    }
    .cmd-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      fill: #38bdf8;
      font-weight: bold;
    }
    .cmd-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #475569;
    }
    .spec-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #64748b;
    }
    .spec-value {
      fill: #ffffff;
      font-weight: bold;
    }
  </style>

  <!-- Title Bar -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1e293b" stroke-width="1" />
  
  <!-- Title Text -->
  <text x="20" y="21" class="chart-title">COMMUNICATION INTERFACES</text>

  <!-- Left Column: Technical Console Launcher -->
  <g transform="translate(20, 0)">
    <text x="0" y="56" class="col-header">TECHNICAL CONSOLE</text>
    <text x="0" y="80" class="cmd-text">npx vansh-vijay</text>
    <text x="0" y="96" class="cmd-sub">Run command in terminal to boot SDE profile</text>
  </g>

  <!-- Column Divider -->
  <line x1="390" y1="32" x2="390" y2="120" stroke="#1e293b" stroke-width="1" />

  <!-- Right Column: Direct Network Connections -->
  <g transform="translate(415, 0)">
    <text x="0" y="56" class="col-header">DIRECT CHANNELS</text>
    <text x="0" y="78" class="spec-label">LINKEDIN : <tspan class="spec-value">linkedin.com/in/vansh-vijay</tspan></text>
    <text x="0" y="96" class="spec-label">EMAIL    : <tspan class="spec-value">vanshvijay9784@gmail.com</tspan></text>
  </g>
</svg>
